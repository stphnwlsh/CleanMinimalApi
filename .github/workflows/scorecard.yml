name: OpenSSF Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 15 * *"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Analysis
        id: analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Results
        id: upload-results
        uses: actions/upload-artifact@v7
        with:
          name: scorecard
          path: results.sarif
          retention-days: 1

  upload:
    name: Scorecard Upload
    runs-on: ubuntu-latest
    needs: analysis
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Results
        id: download-results
        uses: actions/download-artifact@v8
        with:
          name: scorecard

      - name: Fix Locations
        id: fix-locations
        run: |
          jq '(.runs[].results[]?.locations[]?.physicalLocation.artifactLocation | select(.uri == "no file associated with this alert") | .uri) = ".github/workflows/scorecard.yml"' results.sarif > scorecard.sarif

      - name: Upload
        id: upload
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
