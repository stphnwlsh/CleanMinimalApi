name: Build Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      name: ${{ steps.initialize.outputs.name }}
      version: ${{ steps.initialize.outputs.version }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Initialize
        id: initialize
        run: |
          NAME=$(echo ${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')
          VERSION_PREFIX=$(date +'%Y.%m.%d').${GITHUB_RUN_NUMBER}

          if [[ ${GITHUB_EVENT_NAME} == 'pull_request' ]]; then
            BRANCH_BASE=${GITHUB_BASE_REF#refs/*/}
            BRANCH_BASE=${BRANCH_BASE/[^a-zA-Z0-9]//-}
            BRANCH_COMPARE=${GITHUB_HEAD_REF#refs/*/}
            BRANCH_COMPARE=${BRANCH_COMPARE//[^a-zA-Z0-9]/-}
            VERSION_SUFFIX="merge-${BRANCH_BASE}-${BRANCH_COMPARE}"
          fi

          if [[ $VERSION_SUFFIX == '' ]]; then
            VERSION=$VERSION_PREFIX
          else
            VERSION=$VERSION_PREFIX-$VERSION_SUFFIX
          fi

          echo "name=$(eval printf "%s" "$NAME")" >> $GITHUB_OUTPUT
          echo "version_prefix=$(eval printf "%s" "$VERSION_PREFIX")" >> $GITHUB_OUTPUT
          echo "version_suffix=$(eval printf "%s" "$VERSION_SUFFIX")" >> $GITHUB_OUTPUT
          echo "version=$(eval printf "%s" "$VERSION")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Test
        id: test
        run: docker build .
          --target coverage
          --output type=local,dest=out
          --build-arg VERSION_PREFIX=$VERSION_PREFIX
          --build-arg VERSION_SUFFIX=$VERSION_SUFFIX
        env:
          DOCKER_BUILDKIT: 1
          VERSION_PREFIX: ${{ steps.initialize.outputs.version_prefix }}
          VERSION_SUFFIX: ${{ steps.initialize.outputs.version_suffix }}

      - name: Build
        id: build
        run: |
          docker build . \
            --target run \
            --tag $NAME:$VERSION \
            --build-arg VERSION_PREFIX=$VERSION_PREFIX \
            --build-arg VERSION_SUFFIX=$VERSION_SUFFIX
          docker save $NAME:$VERSION --output image.tar
        env:
          DOCKER_BUILDKIT: 1
          NAME: ${{ steps.initialize.outputs.name }}
          VERSION_PREFIX: ${{ steps.initialize.outputs.version_prefix }}
          VERSION_SUFFIX: ${{ steps.initialize.outputs.version_suffix }}
          VERSION: ${{ steps.initialize.outputs.version }}

      - name: Setup .NET
        id: setup
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        id: pack
        run: |
          if [ -z "$SUFFIX" ]; then
            dotnet pack template/template.csproj -p:PackageVersion=$VERSION --configuration Release --output packages
          else
            dotnet pack template/template.csproj -p:PackageVersion=$VERSION-$SUFFIX --configuration Release --output packages
          fi
        env:
          VERSION: ${{ steps.initialize.outputs.version_prefix }}
          SUFFIX: ${{ steps.initialize.outputs.version_suffix }}
        shell: bash

      - name: Verify Template
        id: verify-template
        run: |
          SIZE=$(stat --format=%s packages/*.nupkg)
          echo "Template package is $SIZE bytes"
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::Template package is larger than $MAX_SIZE bytes"
            exit 1
          fi
          dotnet new install packages/*.nupkg
          dotnet new $(jq -r .shortName .template.config/template.json) --name Template.Verification --output verification
          dotnet build verification --configuration Release
        env:
          MAX_SIZE: 1048576
        shell: bash

      - name: Upload Coverage
        id: upload-coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: out/coverage.opencover.xml
          retention-days: 1

      - name: Upload Image
        id: upload-image
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.tar
          retention-days: 1

      - name: Upload Template
        id: upload-template
        uses: actions/upload-artifact@v7
        with:
          name: template
          path: packages/*.nupkg
          retention-days: 1

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Download Coverage
        id: download
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: out

      - name: Upload to Codecov
        id: codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./out/coverage.opencover.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Enforce Threshold
        id: threshold
        run: |
          python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          from collections import defaultdict
          root = ET.parse("out/coverage.opencover.xml").getroot()
          lines = {}
          for module in root.iter("Module"):
              files = {f.get("uid"): f.get("fullPath").replace("\\", "/").split("/sln/", 1)[-1] for f in module.iter("File")}
              for method in module.iter("Method"):
                  ref = method.find("FileRef")
                  default = ref.get("uid") if ref is not None else None
                  for point in method.iter("SequencePoint"):
                      path = files.get(point.get("fileid", default))
                      if path is None or not os.path.isfile(path):
                          continue
                      key = (path, int(point.get("sl")))
                      lines[key] = max(lines.get(key, 0), int(point.get("vc")))
          per_file = defaultdict(lambda: [0, 0])
          for (path, _), hits in lines.items():
              per_file[path][1] += 1
              per_file[path][0] += hits > 0
          for path, (hit, total) in sorted(per_file.items(), key=lambda item: item[1][0] / item[1][1])[:10]:
              print(f"{100 * hit / total:6.2f}%  {hit}/{total}  {path}")
          total = len(lines)
          hit = sum(1 for hits in lines.values() if hits > 0)
          coverage = 100 * hit / total if total else 0
          threshold = float(os.environ["THRESHOLD"])
          print(f"Line coverage {coverage:.2f}% ({hit}/{total}), threshold {threshold}%")
          sys.exit(0 if coverage >= threshold else 1)
          PY
        env:
          THRESHOLD: 95

  scan:
    name: Container Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Download Image
        id: download
        uses: actions/download-artifact@v8
        with:
          name: image

      - name: Load Image
        id: load
        run: docker load --input image.tar

      - name: Scan
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.name }}:${{ needs.build.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Scan
        id: upload-scan
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Enforce Findings
        id: enforce
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.name }}:${{ needs.build.outputs.version }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          skip-setup-trivy: true

  analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "csharp"]

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Initialize
        id: initialize
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - name: Analysis
        id: analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [build, coverage, scan, analysis]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download Template
        id: download-template
        uses: actions/download-artifact@v8
        with:
          name: template
          path: packages

      - name: Login to NuGet
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet Push
        id: nuget-push
        run: dotnet nuget push packages/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: GitHub Release
        id: github-release
        run: gh release create "$VERSION" packages/*.nupkg --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
