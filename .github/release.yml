changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: New features
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Build and pipeline
      labels:
        - build
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
