version: 2

multi-ecosystem-groups:
  monthly-dependencies:
    schedule:
      interval: "cron"
      cronjob: "0 9 15 * *"
      timezone: "America/Chicago"

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-dependencies"

  - package-ecosystem: "docker-compose"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-dependencies"
